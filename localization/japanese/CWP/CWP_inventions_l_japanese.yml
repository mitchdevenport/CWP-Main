l_japanese:
 advanced_agricultural_machinery: "発展型農業機械"
 advanced_agricultural_machinery_desc: "発展型農業機械は、最先端の技術を駆使して作物の収量増加、作業効率の向上、人件費の削減を実現します。"
 ai_integrated_software: "AI統合型ソフトウェア"
 ai_integrated_software_desc: "AI統合型ソフトウェアは、アプリケーションソフトに人工知能と機械学習機能を組み込んだものです。性能、拡張性、使い勝手が向上します。"
 arpanet: "ARPANET"
 arpanet_desc: "ARPANET（アーパネット）は初期のパケット交換ネットワークで、インターネットの先駆けです。米国国防総省が研究機関の間の通信と情報共有を改善するために開発しました。"
 atomic_bomb: "原子爆弾"
 atomic_bomb_desc: "原子爆弾は、核反応を利用して大量のエネルギーを放出する破壊力の強い兵器です。人間の健康や環境、国際関係などに大きな影響を与えます。"
 biological_warfare: "生物戦争"
 biological_warfare_desc: "生物戦争とは、病原体や毒素を意図的に使用し、人間や動植物に危害を加え、あるいは殺害する戦争です。公衆衛生や環境への影響に加え、国家安全保障にも重大な影響を与えます。"
 blocs: "陣営"
 blocs_desc: "陣営とは、利害や価値観を共有する国家や地域間の政治的・経済的な同盟関係を指し、国際関係や世界情勢に影響を与えます。"
 brute_force_particle_separation: "強制偏極法"
 brute_force_particle_separation_desc: "強制偏極法は、高速回転や磁場を利用して、粒子をその物理的性質に基づいて分離する先端技術です。材料科学から医薬品まで、様々な領域での応用が期待されます。"
 chemical_weapons: "化学兵器"
 chemical_weapons_desc: "化学兵器とは、化学物質を用いて人間や動物に危害を加え、あるいは殺害する兵器です。人道的・環境的に壊滅的な影響を与えます。"
 computerized_command_and_control: "指揮統制のデジタル化"
 computerized_command_and_control_desc: "指揮統制のデジタル化は、コンピュータとネットワークを利用して指揮統制活動を調整・自動化する先進的な軍事技術です。複雑で動的な環境における状況認識と作戦の有効性を向上させます。"
 civil_rights: "公民権"
 civil_rights_desc: "公民権とは、社会正義と人間の尊厳を促進するため、すべての個人に対して平等な待遇と機会を保証する法的・社会的権利です。この権利は人種、性別、宗教、その他の特性に関係なく保証されます。"
 combustion_gas_engine: "内燃機関"
 combustion_gas_engine_desc: "燃焼式ガスエンジン技術です。燃料を効率よく燃焼させ、自動車や機械などの動力を生み出します。"
 command_battlesuites: "士官用戦闘服"
 command_battlesuites_desc: "士官用戦闘服とは、軍隊の指揮官が着用する高度な装備です。現場の部隊の状況認識や統制を強化します。"
 decolonization_tech: "脱植民地化"
 decolonization_tech_desc: "脱植民地化とは、植民地支配を解体し、主権を植民地に返還するプロセスです。多くの場合、社会・政治・経済の変革を伴います。"
 depleted_uranium_projectiles: "劣化ウラン弾"
 depleted_uranium_projectiles_desc: "劣化ウランから作られた弾薬です。鉛や鋼鉄よりも密度が高く、装甲車や建物を貫通できます。その一方、放射性物質であるため、健康や環境へのリスクもあります。"
 early_agriculture: "初歩的農業"
 early_agriculture_desc: "農法と動植物の家畜化の発達です。狩猟採集社会から定住社会への移行をもたらしました。"
 early_production: "初歩的生産"
 early_production_desc: "大量生産技術の発達です。製造業に革命をもたらし、消費財が大規模に生産できるようになりました。"
 fire_control_computers: "火器管制コンピュータ"
 fire_control_computers_desc: "火器管制コンピュータは、軍用車両や艦船に搭載され、兵器の照準や発射を支援する電子システムです。多くの場合、高度なセンサーや照準システムが組み込まれます。"
 germ_warfare: "細菌戦"
 germ_warfare_desc: "細菌やウイルスなどの生物剤が戦争で兵器として使用され、公衆衛生と世界の安全保障に重大なリスクをもたらしています。"
 guidance_systems: "誘導システム"
 guidance_systems_desc: "ミサイルやロケットなどの発射体を誘導し、標的に正確に命中させるシステムです。"
 heavy_artillery: "重砲"
 heavy_artillery_desc: "遠距離の標的を攻撃するように設計された大口径の大砲です。軍事作戦に大火力と射程距離を提供します。"
 industrial_dry_docks: "産業用乾ドック"
 industrial_dry_docks_desc: "陸上で船舶の建造・修理・整備を行うための施設です。造船・修理作業のために管理された安全な環境を提供します。"
 intercontinental_ballistic_missiles: "大陸間弾道ミサイル"
 intercontinental_ballistic_missiles_desc: "主に大陸間の長距離を飛行し、核兵器または通常兵器を搭載できるミサイルです。戦略的・地政学的に重要な意味を持ちます。ICBMの略称でも知られます。"
 mechanical_battle_suites: "機械化戦闘服"
 mechanical_battle_suites_desc: "兵士の身体能力を強化するために設計された装甲外骨格です。戦場での機動性、攻撃力、防御力を向上させます。"
 multi_role_aircraft: "マルチロール機"
 multi_role_aircraft_desc: "偵察、空対空戦闘、地上攻撃など複数の機能を持つように設計された航空機です。軍事作戦に多目的で柔軟なプラットフォームを提供します。"
 nuclear_fission: "核分裂"
 nuclear_fission_desc: "原子核が分裂してエネルギーを放出するプロセスで、しばしば放射性を持つ副産物を生成します。原子力発電所や核兵器に使用されます。"
 nuclear_research_facilities: "原子力研究機関"
 nuclear_research_facilities_desc: "エネルギー、医療、材料科学など、原子力科学技術分野の研究開発に用いられる機関です。"
 polymer_coatings: "ポリマーコーティング"
 polymer_coatings_desc: "ポリマーコーティングは、耐久性、耐腐食性、外観などの特性を高めるために表面に塗布するポリマーの薄膜です。自動車、建築、電子機器などの産業で広く使用されます。"
 pre_war_ideological_thought: "戦前型イデオロギー"
 pre_war_ideological_thought_desc: "戦前型イデオロギーとは、第二次世界大戦までの間に流行した政治的・社会的な思想や運動です。ファシズム、共産主義、民族主義、さらにこれらの思想が世界の政治や紛争に与えた影響を含みます。"
 pre_war_naval_tech: "戦前型海軍技術"
 pre_war_naval_tech_desc: "戦前型海軍技術とは、第二次世界大戦以前の海軍の技術や戦争の状態を指します。戦艦などの大型艦が海軍戦略の中心であり、潜水艦や空母が大きく発展したことが特徴です。"
 propellant_gasses: "推進剤"
 propellant_gasses_desc: "推進剤とは、ロケットエンジンで推力を発生させるためのガスです。水素、酸素、メタンなどが用いられ、宇宙開発・宇宙輸送に欠かせない存在です。"
 robotics_integrated_manufacturing: "ロボット統合型製造"
 robotics_integrated_manufacturing_desc: "ロボット統合型製造は、高度なロボット工学と自動化を用いて組立・梱包・品質管理などの作業を行う製造工程です。従来の製造方法と比較して効率・スピード・品質の向上を実現します。"
 rocket_propelled_artillery: "ロケット砲"
 rocket_propelled_artillery_desc: "ロケット砲は、砲弾ではなくロケットを使用して標的に爆発物を投下する砲です。従来の砲に比べ射程距離や精度が向上します。"
 standardized_cartridges: "実包の標準化"
 standardized_cartridges_desc: "実包の標準化とは、銃器用の実包（カートリッジ）を特定の寸法・仕様で製造することです。幅広い銃器への適合性を確保し、弾薬の管理・物流を容易にします。"
 sub_machine_guns: "短機関銃"
 sub_machine_guns_desc: "短機関銃は軽量で携帯可能な銃器で、ピストル口径の弾丸を発射します。近接戦闘などの軍事活動や警察活動で使用されます。サブマシンガンとも呼ばれます。"
 thermal_power_plant: "火力発電所"
 thermal_power_plant_desc: "火力発電所は、熱を利用して電気を作る発電施設で、化石燃料の燃焼や核反応を利用したものが一般的です。世界の主要な電力供給源であると同時に、温室効果ガスの排出や大気汚染の原因となっています。"
 thermonuclear_bomb: "熱核兵器"
 thermonuclear_bomb_desc: "熱核兵器は水素爆弾とも呼ばれ、水素原子の核融合によってエネルギーを得る非常に強力な爆発装置です。"
 uranium_extraction: "ウラン抽出"
 uranium_extraction_desc: "ウラン抽出は、ウラン鉱石を採掘・加工して、原子力発電所で使用するウラン燃料を取り出す工程です。放射能汚染の可能性があるため、環境・安全面で懸念があります。"
