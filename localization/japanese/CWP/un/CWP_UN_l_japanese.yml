l_japanese:
 STARTMEMBERSHIPUN_TOOLTIP: "[concept_member_state]として[concept_united_nations]に加盟することを正式に申請します。主権国家としての完全な承認とそれに伴うすべての特権を享受できます。"
 JOINASOBSERVERUN: "加盟"
 STARTMEMBERSHIPUN: "加盟"
 INTERNATIONAL_ORGANIZATIONS: "国際機関"
 INTERNATIONAL_ORGANIZATIONS_DESC: "[concept_international_organization]とは、国際システムにおける[concept_country]の行動を統制することを目的とした安定的な規範と規則の集合体です。\n \n国際機関は政治的、経済的、軍事的な性質を持ち、条約によって設立されることもあれば、[concept_united_nations]など他の国際機関の延長線上に存在することもあります。"
 APPROVE: "賛成"
 ABSTAIN: "棄権"
 yes: "はい"
 alert_not_un_member_name: "[concept_united_nations]に加盟していません"
 alert_not_un_member_desc: "[GetPlayer.GetName]は現在[concept_united_nations]の加盟国ではありません。国際的に認められておらず、[concept_united_nations]の決議に投票することもできません。"
 alert_not_un_member_hint: "ほぼすべての主権国家が[concept_united_nations]に議席を保持しています。国連における我が国のプレゼンスは、世界における我が国の地位を確立するための重要な一歩となるでしょう。\n\n#i 国際機関パネルを開き、[concept_united_nations]に加盟を申請します#!"
 un_embargo: "国連禁輸"
 un_embargo_desc: "#header 国連禁輸#!\n$TOOLTIP_DELIMITER$\n他の[concept_country]に国連禁輸を発動する[concept_ongoing_diplomatic_action]です。"
 un_embargo_action_notification_name: "国連禁輸"
 un_embargo_action_notification_third_party_name: "国連禁輸"
 un_embargo_action_notification_third_party_desc: "[INITIATOR_COUNTRY.GetName]は[TARGET_COUNTRY.GetName]に国連禁輸を開始しました。"
 un_embargo_action_propose_name: "国連禁輸"
 un_embargo_action_break_name: "国連禁輸の終了"
 un_embargo_pact_desc: "[SCOPE.GetRootScope.GetDiplomaticPact.GetFirstCountry.GetName]は[SCOPE.GetRootScope.GetDiplomaticPact.GetSecondCountry.GetName]に国連禁輸を発動しました。"
 un_embargo_action_notification_break_name: "国連禁輸の終了"
