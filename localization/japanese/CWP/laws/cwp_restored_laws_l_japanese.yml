 law_environmental_protection_agency: "環境保護庁"
 law_environmental_protection_agency_desc: "環境規制を実施するための機関が存在します。"
 law_emission_regulation: "排ガス規制"
 law_emission_regulation_desc: "排ガスは国によって規制されます。"
 law_net_zero: "ネットゼロ"
 law_net_zero_desc: "国は温室効果ガスの排出量を正味ゼロにすると約束します。"
 law_pollution_ban: "汚染禁止"
 law_pollution_ban_desc: "汚染は禁止されます。"
 law_no_family_planning: "産児制限なし"
 law_no_family_planning_desc: "産児制限は存在しません。"
 law_criminalized_birth_control: "避妊の違法化"
 law_criminalized_birth_control_desc: "すべての避妊法は違法です。"
 law_family_planning_programs: "家族計画"
 law_family_planning_programs_desc: "家族計画は少人数家庭を奨励するために設けられます。"
 law_enshrined_reproductive_rights: "生殖権の明記"
 law_enshrined_reproductive_rights_desc: "子供を産むか産まないかを選択する権利が法律に明記されます。"
 law_family_size_controls: "家族人数管理"
 law_family_size_controls_desc: "政府は家族の人数を制限する政策を取ります。"
 law_one_child_policy: "一人っ子政策"
 law_one_child_policy_desc: "子供は家族に一人だけに制限されます。"
 law_unrestricted_human_testing: "倫理基準なし"
 law_unrestricted_human_testing_desc: "人体実験に制限はありません。あらゆる形態のバイオテクノロジーが開発可能です。"
 law_regulated_human_trials: "説明と同意の義務化"
 law_regulated_human_trials_desc: "バイオテクノロジーに関する人体実験を行うには説明と同意が必要です。インフォームドコンセントとも呼ばれます。"
 law_animal_testing_only: "人体実験の制限"
 law_animal_testing_only_desc: "人体実験は厳しく制限されます。バイオテクノロジー研究は厳密に人道的な目的のみに限定されます。"
 law_no_live_testing: "動物実験の制限"
 law_no_live_testing_desc: "動物実験は全面的に禁止されます。あらゆるバイオテクノロジー研究が困難になります。"
 law_theoretical_research_only: "実験禁止"
 law_theoretical_research_only_desc: "あらゆる形態のバイオテクノロジー研究は厳しい倫理審査を通過しなければなりません。新しいバイオテクノロジーの開発を困難にします。"
 law_total_prohibition: "完全禁止"
 law_total_prohibition_desc: "あらゆる嗜好用薬物が違法です。"
 law_tobacco_allowed: "タバコの許可"
 law_tobacco_allowed_desc: "タバコは合法ですが、その他の嗜好用薬物はすべて違法です。"
 law_alcohol_allowed: "アルコールの許可"
 law_alcohol_allowed_desc: "アルコールとタバコだけが合法です。"
 law_all_drugs_allowed: "全薬物の許可"
 law_all_drugs_allowed_desc: "あらゆる嗜好用薬物が合法です。"
