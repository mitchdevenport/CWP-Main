 law_heavy_industry_nationalization_desc: "ほとんどの重要産業を国が所有します。"
 law_military_industry_nationalization: "軍需産業国有化"
 law_military_industry_nationalization_desc: "軍事に関する産業を国が所有します。"
 law_resource_extraction_nationalization: "資源採掘国有化"
 law_resource_extraction_nationalization_desc: "国の天然資源は政府に帰属します。"
