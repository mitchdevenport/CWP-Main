 law_confederated: "連合国家"
 law_confederated_desc: "政府は完全に地方分権化され、地方政府が大部分の権力を握ります。"
 law_federalized: "連邦国家"
 law_federalized_desc: "政府は地方分権的で、地方政府が多くの権力を握ります。"
 law_devolved: "分権国家"
 law_devolved_desc: "政府は中央集権的ですが、地方政府による権限も残ります。"
 law_unitary: "単一国家"
 law_unitary_desc: "政府は完全に中央集権化され、中央政府がすべての権力を握ります。"
 law_total_nationalization: "完全国有化"
 law_total_nationalization_desc: "すべての産業を国が所有します。"
