l_japanese:
 # Untranslated: English text kept until a Japanese translation is available
 ideology_cwp_security_establishment: "Security Establishment"
 ideology_cwp_security_establishment_desc: "This group favors professional armed forces, experienced appointed administrators and permanent intelligence institutions."
 ideology_cwp_religious_social_solidarity: "Religious Social Solidarity"
 ideology_cwp_religious_social_solidarity_desc: "This group regards worker protection, social provision and the education and protection of children as moral obligations."
 ideology_cwp_organized_employers: "Organized Employers"
 ideology_cwp_organized_employers_desc: "This group defends managerial control and corporate freedom while accepting negotiated labor relations and access to migrant labor."
 ideology_cwp_constitutional_intelligentsia: "Constitutional Intelligentsia"
 ideology_cwp_constitutional_intelligentsia_desc: "This group demands independent courts, professional administration and freedom of conscience."
 ideology_cwp_commercial_landowners: "Commercial Landowners"
 ideology_cwp_commercial_landowners_desc: "This group defends commercial and estate agriculture against compulsory redistribution, heavy land taxes and strong rural labor organization."
 ideology_cwp_small_proprietors: "Small Proprietors"
 ideology_cwp_small_proprietors_desc: "This group seeks protection from monopolies, moderate taxation and predictable independent courts."
 ideology_cwp_cooperative_agrarianism: "Cooperative Agrarianism"
 ideology_cwp_cooperative_agrarianism_desc: "This group supports family holdings and voluntary producer cooperation, fair competition and accessible schooling."
 ideology_cwp_free_trade_unionism: "Free Trade Unionism"
 ideology_cwp_free_trade_unionism_desc: "This group seeks unions independent of employers and ruling parties, democratic participation and independent courts."
