l_japanese:
 # Untranslated: English text kept until a Japanese translation is available
 ideology_cwp_marxist_leninist: "Centralist Communist"
 ideology_cwp_marxist_leninist_desc: "#lore This leader advocates a council republic, a single ruling party, central planning and state-directed labor organization.#!"
 ideology_cwp_maoist: "Agrarian Communist"
 ideology_cwp_maoist_desc: "#lore This leader centers communist revolution on collective farming, party rule and mass military mobilization.#!"
 ideology_cwp_titoist: "Self-Management Socialist"
 ideology_cwp_titoist_desc: "#lore This leader favors workers self-management and workplace councils under socialist party leadership, with greater freedom of movement.#!"
 ideology_cwp_democratic_socialist: "Democratic Socialist"
 ideology_cwp_democratic_socialist_desc: "#lore This leader pursues electoral democracy, a mixed or cooperative economy, public healthcare and a strong welfare state.#!"
 ideology_cwp_christian_democrat: "Christian Democrat"
 ideology_cwp_christian_democrat_desc: "#lore This leader combines democratic participation, freedom of conscience, competition policy and social insurance.#!"
 ideology_cwp_social_liberal: "Social Liberal"
 ideology_cwp_social_liberal_desc: "#lore This leader prioritizes independent courts, equal citizenship, competition rules and protection of workers.#!"
 ideology_cwp_national_developmentalist: "National Developmentalist"
 ideology_cwp_national_developmentalist_desc: "#lore This leader pursues national industrial development through a mixed economy, strategic firms, protective trade policy and land reform.#!"
 ideology_cwp_national_populist: "National Populist"
 ideology_cwp_national_populist_desc: "#lore This leader builds a strong presidency around organized labor, worker protections and social provision.#!"
 ideology_cwp_arab_socialist: "Arab Socialist"
 ideology_cwp_arab_socialist_desc: "#lore This leader seeks republican Arab renewal through a single-party developmental state, public economic direction and land redistribution.#!"
 ideology_cwp_african_socialist: "African Socialist"
 ideology_cwp_african_socialist_desc: "#lore This leader advocates cooperative development, collective agriculture, public education and equal citizenship.#!"
 ideology_cwp_military_developmentalist: "Military Developmentalist"
 ideology_cwp_military_developmentalist_desc: "#lore This leader favors authoritarian direction of a mixed economy, national industrial champions and disciplined labor relations.#!"
 ideology_cwp_market_conservative: "Market Conservative"
 ideology_cwp_market_conservative_desc: "#lore This leader prioritizes private enterprise, corporate deregulation, lower progressive tax burdens and restrictions on union power.#!"
