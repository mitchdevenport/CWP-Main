l_japanese:
 # Untranslated: English text kept until a Japanese translation is available
 ideology_cwp_gaullist: "Presidential Developmentalist"
 ideology_cwp_gaullist_desc: "This character favors a strong elected presidency, national industrial champions, and state guidance of a mixed economy."
 ideology_cwp_social_market_liberal: "Social Market Liberal"
 ideology_cwp_social_market_liberal_desc: "This character seeks prosperity through competitive private enterprise, open trade, and a state strong enough to prevent monopolies."
 ideology_cwp_one_nation_conservative: "Welfare Conservative"
 ideology_cwp_one_nation_conservative_desc: "This character combines constitutional tradition and private enterprise with a practical commitment to pensions, public health, and social stability."
 ideology_cwp_nordic_social_democrat: "Universalist Social Democrat"
 ideology_cwp_nordic_social_democrat_desc: "This character seeks universal social provision, redistributive taxation, and independent trade unions with a voice in economic life."
 ideology_cwp_civil_rights_reformer: "Civil Rights Reformer"
 ideology_cwp_civil_rights_reformer_desc: "This character campaigns for equal citizenship, effective voting rights, peaceful protest, and fair treatment at work."
 ideology_cwp_liberation_theologian: "Liberation Theologian"
 ideology_cwp_liberation_theologian_desc: "This character understands Christian commitment as solidarity with the poor, supporting land reform, material security, and independent popular organization."
 ideology_cwp_green: "Green"
 ideology_cwp_green_desc: "This character advocates nonviolence, democratic participation, and limits on concentrated economic power as part of an ecological political vision."
 ideology_cwp_second_wave_feminist: "Civic Feminist"
 ideology_cwp_second_wave_feminist_desc: "This character seeks equal participation for women in education, employment, politics, and the protection of the law."
 ideology_cwp_libertarian: "Libertarian"
 ideology_cwp_libertarian_desc: "This character defends voluntary exchange, free expression, open trade, and an armed force staffed by volunteers rather than conscripts."
 ideology_cwp_dissident_democrat: "Dissident Democrat"
 ideology_cwp_dissident_democrat_desc: "This character opposes party monopoly and political repression, demanding public accountability, freedom of expression, and independent justice."
 ideology_cwp_solidarity_unionist: "Independent Unionist"
 ideology_cwp_solidarity_unionist_desc: "This character seeks independent trade unions, freedom of expression and conscience, and material guarantees for workers and their families."
 ideology_cwp_agrarian_reformer: "Agrarian Reformer"
 ideology_cwp_agrarian_reformer_desc: "This character seeks a modern republic of productive smallholders, breaking landed monopolies while promoting national economic development."
