 concept_wmd_target_list: "Target List"
 concept_wmd_target_list_desc: "A list of targets determined by a country possessing nuclear weapons."
 concept_wmd_coverage: "Nuclear Coverage"
 concept_wmd_coverage_desc: "Nuclear Coverage is how effectively a country is able to strike targets in a specific strategic region, it is affected by factors such as:\n$TAB$- Deploying [concept_nuclear_weapons] in that region.\n$TAB$- The level of strategic airbases a country has\n$TAB$- Whether or not the country has a strategic airbase in that strategic region"
 concept_nuclear_program: "Nuclear Program"
 concept_nuclear_program_desc: "A Nuclear Program is a national effort to master nuclear technology, from building the first [concept_nuclear_reactor] to developing the [concept_atomic_bomb], the [concept_thermonuclear_bomb] and intercontinental ballistic missiles. Its progress depends on the number of $building_nuclear_research_facility$ levels, the country's technology and the expertise of its scientists, and every stage must be confirmed by a successful [concept_nuclear_test]."
 concept_nuclear_test: "Nuclear Test"
 concept_nuclear_test_desc: "A Nuclear Test is the controlled start-up of an experimental reactor or the detonation of a nuclear device, carried out to prove that a design works. Every stage of a [concept_nuclear_program] must end with a successful test, while failed tests can set the program back or even cause a disaster at the test site."
 concept_nuclear_reactor: "Nuclear Reactor"
 concept_nuclear_reactor_desc: "A nuclear reactor sustains a controlled nuclear chain reaction. Building one is the first goal of most [concept_nuclear_program]s, and the country that masters it may construct nuclear power plants."
 concept_atomic_bomb: "Atomic Bomb"
 concept_atomic_bomb_desc: "An atomic bomb uses nuclear fission to release an enormous amount of energy in a single explosion. A country that develops one becomes able to produce [concept_nuclear_weapons] and to build $building_nuclear_weapons_facility$s and $building_strategic_airbase$s."
 concept_thermonuclear_bomb: "Thermonuclear Bomb"
 concept_thermonuclear_bomb_desc: "A thermonuclear, or hydrogen, bomb uses a fission explosion to ignite nuclear fusion, releasing hundreds of times more energy than the first [concept_atomic_bomb]s."
 concept_detonation_focus: "Detonation Focus"
 concept_detonation_focus_desc: "The detonation focus decides how our [concept_nuclear_weapons] are detonated over their targets:\n$TAB$- #b Air Burst#! detonations cause greater upfront damage and minimal radioactive fallout.\n$TAB$- #b Ground Burst#! detonations cause less upfront damage, but scatter the area with radioactive material, causing immense nuclear fallout."
 concept_deployment_percentage: "Deployment Percentage"
 concept_deployment_percentage_desc: "The share of our [concept_nuclear_stockpile] that is launched when we fire our [concept_nuclear_weapons], spread over the states of our [concept_wmd_target_list]."
 concept_nuclear_strike_effectiveness: "Nuclear Strike Effectiveness"
 concept_nuclear_strike_effectiveness_desc: "Nuclear Strike Effectiveness measures how much destruction our [concept_nuclear_weapons] cause once they reach a target. It depends on whether we possess the [concept_atomic_bomb] or the [concept_thermonuclear_bomb], our technology, and the size and urbanization of the targeted state."
 concept_nuclear_delivery_effectiveness: "Nuclear Delivery Effectiveness"
 concept_nuclear_delivery_effectiveness_desc: "Nuclear Delivery Effectiveness is the chance that our [concept_nuclear_weapons] actually reach a targeted state. It depends on our [concept_wmd_coverage] of the state's strategic region, the reach of our navy and our missile technology."
 lawgroup_wmds_desc: "Determines whether and how a country may research, build and use weapons of mass destruction."
 german_scientists: "German Scientists"
 german_scientists_desc: "Scientists brought in from Germany after the war are accelerating our [concept_nuclear_program]."
 developing_civilian_nuclear_capability: "Developing Civilian Nuclear Capability"
 developing_civilian_nuclear_capability_desc: "We are running a [concept_nuclear_program] to build our first [concept_nuclear_reactor]."
 civilian_nuclear_capable: "Nuclear Power Capable"
 civilian_nuclear_capable_desc: "We have mastered the [concept_nuclear_reactor] and may build nuclear power plants."
 developing_atomic_bomb: "Developing Atomic Bomb"
 developing_atomic_bomb_desc: "We are running a [concept_nuclear_program] to develop the [concept_atomic_bomb]."
 atomic_capable: "Atomic Capable"
 atomic_capable_desc: "We possess the [concept_atomic_bomb] and are able to produce [concept_nuclear_weapons]."
 developing_thermonuclear_bomb: "Developing Thermonuclear Bomb"
 developing_thermonuclear_bomb_desc: "We are running a [concept_nuclear_program] to develop the [concept_thermonuclear_bomb]."
 thermonuclear_capable: "Thermonuclear Capable"
 thermonuclear_capable_desc: "We possess the [concept_thermonuclear_bomb]."
 developing_icbm: "Developing ICBM"
 developing_icbm_desc: "We are running a [concept_nuclear_program] to develop intercontinental ballistic missiles."
 icbm_capable: "ICBM Capable"
 icbm_capable_desc: "We possess intercontinental ballistic missiles and may build $building_nuclear_weapons_silo$s."
 nuclear_strike: "Nuclear Strike"
 nuclear_strike_desc: "This state has been struck by [concept_nuclear_weapons]."
 atomic_test_conducted: "Atomic Test Conducted"
 atomic_test_conducted_desc: "An atomic bomb has recently been detonated here as part of a [concept_nuclear_test]."
 thermonuclear_test_conducted: "Thermonuclear Test Conducted"
 thermonuclear_test_conducted_desc: "A thermonuclear bomb has recently been detonated here as part of a [concept_nuclear_test]."
