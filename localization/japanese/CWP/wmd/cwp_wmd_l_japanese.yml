l_japanese:
 NUCLEAR_PROD_TOOLTIP_FORMAT: "$VALUE|-O$ $KEY$"
 establish_nuclear_research_facility: "原子力研究施設の設立"
 establish_nuclear_research_facility_desc: "発電のためであれ、将来の兵器開発のためであれ、原子力研究施設の設立は我が国の能力を大きく向上させるだろう。"
 concept_nuclear_weapons: "核弾頭"
 concept_nuclear_weapons_desc: "核弾頭は、ミサイル、ロケットなどの運搬システムの部品となる核兵器です。核弾頭が発射され、目標に到達して爆発すると、計り知れない破壊と長期的な放射性降下物の被害を引き起こします。"
 concept_nuclear_stockpile: "核備蓄"
 concept_nuclear_stockpile_desc: "核備蓄は、ある国が保有する核兵器の備蓄です。武力紛争や地政学的危機の際に戦略的抑止力や潜在的な軍事資源として機能します。"
 concept_nuclear_stockpile_max: "最大核備蓄量"
 concept_nuclear_stockpile_max_desc: "最大核備蓄量とは、一国が保有できる核兵器の最大量です。戦略的バランスを保ち、過度の軍拡を防ぐため、しばしば国際条約や国際協定によって制限されます。"
 lawgroup_wmds: "大量破壊兵器"
 law_no_wmds: "大量破壊兵器なし"
 law_no_wmds_desc: "大量破壊兵器を研究したり製造したりする計画はありません。"
 law_civilian_applications: "民生利用"
 law_civilian_applications_desc: "民生目的または防衛目的ならば大量破壊兵器関連技術の利用が許されます。"
 law_deterrence: "抑止力"
 law_deterrence_desc: "大量破壊兵器を開発し、外国の侵略に対する抑止力として使用することが許されます。"
 law_first_strike: "先制攻撃"
 law_first_strike_desc: "大量破壊兵器を先制攻撃の選択肢として使うことが許されます。"
 ACQUIRE_NUCLEAR_FAIL: "核開発計画は中止された。"

