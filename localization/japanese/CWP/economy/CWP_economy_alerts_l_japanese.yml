l_japanese:
 alert_large_money_supply_change_action: "金融政策パネル"
 alert_interest_minus_name: "マイナス金利"
 alert_interest_minus_desc: "[GetPlayer.GetName]の通貨はマイナス[concept_interest_rate]です。これは経済に予期せぬ結果をもたらす可能性があります。"
 alert_interest_minus_hint: "マイナス[concept_interest_rate]は、銀行の信用低下、金融機関の不安定化、国の通貨価値の下落など、経済への予期せぬ影響を引き起こす可能性があります。金利をプラスに引き上げてください。"
 alert_interest_minus_action: "金融政策パネル"
 alert_dangerous_inflation_name: "危険水準の[concept_inflation]（#n [GetPlayer.MakeScope.ScriptValue('inflation_value')|nd]%#!）"
 alert_dangerous_inflation_desc: "[GetPlayer.GetName]の[concept_inflation]は危険水準にあります（#n [GetPlayer.MakeScope.ScriptValue('inflation_value')|nd]%#!）\n\nこの値を下げるためになにも手を打たなければ、[GetPlayer.GetNameNoFlag]は早晩インフレ危機に陥るかもしれません。"
 alert_dangerous_inflation_hint: "[concept_interest_rate]を上げるか[concept_money_supply]の割合を下げることで[concept_inflation]を抑制できます。"
 alert_dangerous_inflation_action: "金融政策パネル"
 alert_dangerous_deflation_name: "危険水準の[concept_deflation]（#n [GetPlayer.MakeScope.ScriptValue('inflation_value')|nd]%#!）"
 alert_dangerous_deflation_desc: "[GetPlayer.GetName]の[concept_deflation]は危険水準にあります（#n [GetPlayer.MakeScope.ScriptValue('inflation_value')|nd]%#!）\n\nこの値を下げるためになにも手を打たなければ、[GetPlayer.GetNameNoFlag]は早晩デフレ危機に陥るかもしれません。"
 alert_dangerous_deflation_hint: "[concept_interest_rate]を下げるか[concept_money_supply]の割合を上げることで[concept_deflation]を抑制できます。"
 alert_dangerous_deflation_action: "金融政策パネル"
 alert_dangerous_inflation_growth_name: "危険水準の[concept_inflation]率上昇（[GetPlayer.MakeScope.ScriptValue('inflation_growth')|-d]/月）"
 alert_dangerous_inflation_growth_desc: "[GetPlayer.GetName]の[concept_inflation]率上昇は危険水準にあります（[GetPlayer.MakeScope.ScriptValue('inflation_growth')|-d]/月）\n\nこの値を下げるためになにも手を打たなければ、[GetPlayer.GetNameNoFlag]は早晩インフレ危機に陥るかもしれません。"
 alert_dangerous_inflation_growth_hint: "[concept_interest_rate]を上げるか[concept_money_supply]の割合を下げることで[concept_inflation]率上昇を抑制できます。"
 alert_dangerous_inflation_growth_action: "金融政策パネル"
 alert_dangerous_deflation_growth_name: "危険水準の[concept_deflation]率上昇（[GetPlayer.MakeScope.ScriptValue('inflation_growth')|+d]/月）"
 alert_dangerous_deflation_growth_desc: "[GetPlayer.GetName]の[concept_deflation]率上昇は危険水準にあります（[GetPlayer.MakeScope.ScriptValue('inflation_growth')|+d]/月）\n\nこの値を下げるためになにも手を打たなければ、[GetPlayer.GetNameNoFlag]は早晩デフレ危機に陥るかもしれません。"
 alert_dangerous_deflation_growth_hint: "[concept_interest_rate]を下げるか[concept_money_supply]の割合を上げることで[concept_deflation]率上昇を抑制できます。"
 alert_dangerous_deflation_growth_action: "金融政策パネル"
 alert_bank_credibility_to_be_lowered_name: "[concept_central_bank]の[concept_bank_credibility]変化予測 | [GetPlayer.GetCustom('bank_credibility_loc')] > [GetPlayer.GetCustom('bank_credibility_forecast_loc')]"
 alert_bank_credibility_to_be_lowered_desc: "財政と金融の現状に基づき[GetPlayer.GetAdjective][concept_central_bank]の[concept_bank_credibility]はまもなく更新されます。\n\n[concept_central_bank]の信用格付けは[GetPlayer.GetCustom('bank_credibility_forecast_loc')]に変化すると予測され、これは[GetPlayer.GetCustom('bank_credibility_forecast_desc')]とみなされます。"
 alert_bank_credibility_to_be_lowered_hint: "[concept_bank_credibility]の予測を向上させるには、借金の返済、インフレ率の低下、インフレ率上昇の安定化、[concept_central_bank]の独立性向上が役立ちます。"
 alert_bank_credibility_to_be_lowered_action: "金融政策パネル"
 ag_alert_group_monetary_name: "[concept_monetary_policy]問題"
 ag_alert_group_monetary_tooltip: "[concept_monetary_policy]と経済に関する通知"
 ag_alert_group_imf_name: "#gold IMF#!問題"
 ag_alert_group_imf_tooltip: "[concept_imf]に関する通知"
 alert_not_paying_imf_debt_action: "[concept_imf]パネル"
 alert_can_apply_for_imf_loan_name: "#gold IMF#!融資を要請できます"
 alert_can_apply_for_imf_loan_desc: "我が国は現在#gold IMF#!融資を要請する資格があります"
 alert_can_apply_for_imf_loan_hint: "[concept_imf]の融資は、国家をさらに発展させたり、経済を立て直したりするための莫大な資金をもたらします。"

 # Untranslated: English text kept until a Japanese translation is available
 alert_large_money_supply_change_name: "High level of [concept_money_supply] change per month(#v [GetPlayer.MakeScope.ScriptValue('money_supply_growth_percentage')|vd]%#!)"
 alert_large_money_supply_change_desc: "The [GetPlayer.GetAdjective] [concept_money_supply] is currently experience high levels of change per month(#v [GetPlayer.MakeScope.ScriptValue('money_supply_growth_percentage')|vd]%#!), this might have unintended side-effects if not done intentionally"
 alert_large_money_supply_change_hint: "A rapid increase/decrease in [concept_money_supply] may be adventageous if dealing with high levels of [concept_deflation] or [concept_inflation], but might make our monetary policies more volatile and harder to control."
 alert_not_paying_imf_debt_name: "Not Paying #gold IMF#! Debts"
 alert_not_paying_imf_debt_desc: "We are not current paying any of our debts to the [concept_imf]"
 alert_not_paying_imf_debt_hint: "Visit the [concept_imf] panel to set your monthly debt payment percentage to the #gold IMF#!, you generally want to keep your payments above your loan's monthly interest growth."
 alert_can_apply_for_imf_loan_action: "$alert_not_paying_imf_debt_action$"
 alert_not_withdrawing_imf_credit_name: "Not Withdrawing any [concept_imf_credit_payments]"
 alert_not_withdrawing_imf_credit_desc: "We are currently not withdrawing any of our available [GetPlayer.MakeScope.ScriptValue('imf_credit_value')|pd]$GLOBAL_CURRENCY_ICON$ Credit"
 alert_not_withdrawing_imf_credit_hint: "[concept_imf_credit_payments] can be used to bolster our balance."
 alert_not_withdrawing_imf_credit_action: "$alert_not_paying_imf_debt_action$"
 alert_imf_austerity_measures_name: "#gold IMF#! Austerity Measures in effect in [GetPlayer.GetNameNoFlag]"
 alert_imf_austerity_measures_desc: "Due to our inability to pay our debt to the [concept_imf], austerity measures have been put in place until we have sufficiently paid off our debt and changed our policies in line with #gold IMF#! Standards"
 alert_imf_austerity_measures_hint: "Austerity Measures will decrease our [concept_central_bank][concept_bank_credibility] as well as decreasing our construction efficiency and prestige, we should look to paying off our loans as quickly as possible."
 alert_imf_austerity_measures_action: "$alert_not_paying_imf_debt_action$"
 alert_imf_bailout_name: "#gold IMF#! Bailout in [GetPlayer.GetNameNoFlag]"
 alert_imf_bailout_desc: "We have asked the [concept_imf] for a bailout, and as such terms have been put in place until we have sufficiently paid off our debt and changed our policies in line with #gold IMF#! Standards"
 alert_imf_bailout_hint: "IMF Bailouts will decrease our [concept_central_bank][concept_bank_credibility] as well as decreasing our construction efficiency and prestige, we should look to paying off our loans and reforming our economy as quickly as possible."
 alert_imf_bailout_action: "$alert_not_paying_imf_debt_action$"
