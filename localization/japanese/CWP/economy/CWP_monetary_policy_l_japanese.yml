l_japanese:
 lawgroup_monetary_policy: "金融政策"
 law_gold_standard: "金本位制"
 law_gold_standard_desc: "この政策は、自国通貨と一定量の金との間に固定為替レートを設定するものです。通貨の価値は、政府または中央銀行が保有する金準備高に直接連動します。インフレ圧力を抑制し安定性をもたらしますが、金融の柔軟性を制限する可能性があります。"
 law_government_controlled: "政府管理"
 law_government_controlled_desc: "政府は国の通貨制度を直接管理します。金利を設定し、通貨供給量を調整し、インフレと経済成長を管理するのです。\n\n中央銀行に対する政府の直接的な介入は、通常、差し迫った問題に対する中央銀行の対応能力を制限します。"
 law_government_interference: "政府介入"
 law_government_interference_desc: "政府は特定の経済目標を達成するために通貨制度に介入します。通貨市場への直接介入、金利の設定、その他の管理形態を含みます。\n\n政府は為替レートの管理、経済の安定化、不均衡への対処を目的としますが、過度の介入は意図しない結果を招きかねません。"
 law_independent_monetary_policy: "独立金融政策"
 law_independent_monetary_policy_desc: "中央銀行は政府から独立して運営され、政治的な影響を直接受けることなく金融に関する決定を下します。\n\n中央銀行は物価安定の維持、インフレの抑制、経済の安定促進に重点を置きます。また、政治的圧力からの独立性を維持しつつ、経済にとって最善となるよう行動します。"
 law_pegged_currency: "固定通貨"
 law_pegged_currency_desc: "この政策は、自国通貨の為替レートを他の通貨または通貨バスケットに対して固定します。中央銀行または政府は、国内通貨の価値が機軸通貨に対して安定していることを保証するのです。\n\nこの政策は貿易と安定を促進しますが、国の金融政策は機軸通貨の金融政策の影響を受けることになります。"
 ideology_confident_monetarist: "自信ある通貨主義者"
 ideology_confident_monetarist_desc: "#Lore このグループは、現在の経済力を維持するために金融政策を用いることを信奉しています。#!"
 ideology_worried_monetarist: "心配する通貨主義者"
 ideology_worried_monetarist_desc: "#Lore このグループは、困難な状況を解決するために金融政策を用いるべきだと考えています。#!"
 ideology_fearful_monetarist: "危惧する通貨主義者"
 ideology_fearful_monetarist_desc: "#Lore このグループは、悲惨な状況を解決するために金融政策を用いるべきだと考えています。#!"
 ideology_panicked_monetarist: "動揺する通貨主義者"
 ideology_panicked_monetarist_desc: "#Lore このグループは、破滅的な状況を解決するために金融政策を用いるべきだと考えています。#!"
 ideology_confident_fiscalist: "自信ある財政主義者"
 ideology_confident_fiscalist_desc: "#Lore このグループは、現在の経済力を維持するために財政政策を用いることを信奉しています。#!"
 ideology_worried_fiscalist: "心配する財政主義者"
 ideology_worried_fiscalist_desc: "#Lore このグループは、困難な状況を解決するために財政政策を用いるべきだと考えています。#!"
 ideology_fearful_fiscalist: "危惧する財政主義者"
 ideology_fearful_fiscalist_desc: "#Lore このグループは、悲惨な状況を解決するために財政政策を用いるべきだと考えています。#!"
 ideology_panicked_fiscalist: "動揺する財政主義者"
 ideology_panicked_fiscalist_desc: "#Lore このグループは、破滅的な状況を解決するために財政政策を用いるべきだと考えています。#!"

