l_japanese:
 concept_united_nations: "国際連合"
 concept_united_nations_desc: "国際連合（国連）は数ある[concept_international_organization]の一つです。その目的は、国際の平和および安全を維持し、諸国間の友好関係を発展させ、国際協力を達成し、諸国の行動を調和するための中心となることです。"
 concept_international_organization: "国際機関"
 concept_international_organization_desc: "国際機関とは、様々な軍事的・経済的目標を管理・執行するために相互に合意された規範や規則を持つ国家の集まりです。著名な組織として[concept_united_nations]、[concept_world_health_organization]、[concept_nato]などがあります。国際機関は主に[Concept('concept_member_state', '加盟国')]で構成されますが、特定の国が[concept_observer_status]を保持することもあります。"
 concept_observer_status: "オブザーバー資格"
 concept_observer_status_desc: "オブザーバー資格とは、[concept_international_organization]の[concept_member_state]ではないが、その機関の活動への参加を希望する[concept_country]に与えられる資格です。決定に対する投票権は与えられませんが、しばしば議論や討論に参加することができ、その機関が制定した法を遵守することに同意します。"
 concept_world_health_organization: "世界保健機関"
 concept_world_health_organization_desc: "世界保健機関（WHO）は、国際的な公衆衛生を担当する[concept_united_nations]内の専門機関です。"
 concept_member_state: "加盟国"
 concept_member_state_desc: "加盟国とは、[concept_international_organization]、連邦、連合に加盟している[concept_country]のことです。"
 concept_alignment: "同調"
 concept_alignment_desc: "各[concept_country]は[concept_superpower]に同調し、その国の国際問題を支援することができます。"
 concept_nato_desc: "北大西洋条約機構（NATO）は、第二次世界大戦後に設立された政府間軍事[concept_alliance]です。[concept_nato]は集団安全保障システムで、独立した加盟国が第三者の侵略から互いに防衛することに合意しています。"
 concept_warsaw_pact: "ワルシャワ条約機構"
 concept_warsaw_pact_desc: "ワルシャワ条約機構は、ソビエト連邦が主導する集団防衛条約です。主に共産主義の組織であり、[concept_nato]に対する勢力均衡または対抗軸として機能します。"
 concept_non_aligned: "非同盟"
 concept_non_aligned_desc: "非同盟運動（NAM）とは、どの陣営にも正式に属さず、どの陣営にも反対しない国々で構成される組織です。非同盟運動は[concept_united_nations]に次ぐ世界最大の国家グループです。"
 concept_un_member_state: "国連加盟国"
 concept_un_member_state_desc: "国連加盟国は、国連に完全かつ対等な加盟国として認められ、そのグローバル・ガバナンスと意思決定プロセスに参加している主権国家です。"
 concept_unsc_member: "国連安保理加盟国"
 concept_unsc_member_desc: "国連安保理加盟国は、国連安全保障理事会に議席を持つ国です。意思決定や制裁・軍事力行使を通じて国際社会の平和と安全の維持に重要な役割を果たします。"
 concept_corruption: "汚職"
 concept_corruption_desc: "汚職は、権力者が私利私欲のためにその地位を利用することを表します。汚職は時間の経過とともに[concept_corruption_baseline]に近づき、国家に多くの悪影響をもたらします。"
 concept_corruption_baseline: "基準汚職"
 concept_corruption_baseline_desc: "基準汚職は[concept_corruption]の基本量であり、国家は時間経過とともにその値に引き寄せられます。\n\n基準汚職は[concept_government]内の[Concept('concept_interest_group', '$concept_interest_groups|q$')]の平均[concept_ig_corruption]から計算されます。"
 concept_ig_corruption: "利益集団汚職"
 concept_ig_corruption_desc: "利益集団汚職は、その国の各[concept_interest_group]によって生み出される[concept_corruption]の量です。\n\n利権集団は、[concept_government]内にいると政権を握っていた期間に応じて汚職が増加します。汚職政治家や汚職イベントも伴います。汚職は、$concept_opposition$にいるか、正直なリーダー、イベント、汚職対策のディシジョンによって低下させられます。"
 concept_pollution: "汚染"
 concept_pollution_desc: "汚染は、現在の汚染の排出量を表し、ある国のすべての産業の方式と[Concept('concept_pop', '$concept_pops|q$')]が生み出す汚染の合計です。汚染は地球温暖化と気候変動の原因になります。"
 concept_un_intervention: "国連の介入"
 concept_un_intervention_desc: "国連の介入は、国連が平和維持軍やその他の専門機関を通じて行う活動です。安定を回復し人権を保護するため、紛争や人道危機、国際法違反に対処します。"
 concept_central_bank: "中央銀行"
 concept_bank_independence: "中央銀行の独立性"
 concept_bank_credibility: "信用格付け"
 concept_interest_rate: "金利"
 concept_inflation_rate: "インフレ率"
 concept_hyperinflation: "ハイパーインフレ"
 concept_inflation: "インフレ"
 concept_deflation: "デフレ"
 concept_hyperdeflation: "ハイパーデフレ"
 concept_money_supply: "通貨供給量"
 concept_monetary_policy: "金融政策"
 concept_expansionary_monetary_policy: "緩和"
 concept_contractionary_monetary_policy: "緊縮"
 concept_stable_monetary_policy: "安定"
 concept_gold_standard: "金本位制"
 concept_fiat_currency: "不換紙幣"
 concept_pegged_currency: "固定通貨"
 concept_foreign_reserves: "外貨準備高"
 concept_currency: "通貨"
 concept_currency_desc: "通貨とは特定の国家で流通している貨幣のシステムです。"
 concept_imf: "国際通貨基金"
