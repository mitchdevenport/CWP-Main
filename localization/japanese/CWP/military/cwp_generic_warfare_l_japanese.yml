l_japanese:
 # Untranslated: English text kept until a Japanese translation is available
 je_post_war_infantry_reason: "The last war has shown that infantry can no longer be raised and trained the way it once was. Standardised drills and field manuals must become the backbone of our army.\n$TOOLTIP_DELIMITER$\nCompleted once #v 80%#! of our $building_barrack$ levels (#v 40%#! while at [concept_war]) use $pm_codified_instruction_barracks$.\n#lore Researching $mobile_warfare$ will also complete this entry.#!"
 je_2nd_generation_infantry_reason: "A new generation of infantry weapons demands soldiers who have mastered them in thorough basic training, not merely in the field.\n$TOOLTIP_DELIMITER$\nCompleted once #v 80%#! of our $building_barrack$ levels (#v 40%#! while at [concept_war]) use $pm_basic_training_barracks$.\n#lore Researching $squad_specialist_weapons$ will also complete this entry.#!"
 je_3rd_generation_infantry_reason: "Modern infantry squads fight as small, independent teams. Their success rests on experienced non-commissioned officers capable of leading them.\n$TOOLTIP_DELIMITER$\nCompleted once #v 80%#! of our $building_barrack$ levels (#v 40%#! while at [concept_war]) use $pm_nco_instruction_barracks$.\n#lore Researching $fourth_generation_warfare$ will also complete this entry.#!"
 je_4th_generation_infantry_reason: "The battlefields of our time are fought against irregular enemies as much as against conventional armies. Our infantry must be schooled in every aspect of modern combat.\n$TOOLTIP_DELIMITER$\nCompleted once #v 80%#! of our $building_barrack$ levels (#v 40%#! while at [concept_war]) use $pm_combat_schooling_barracks$."
 je_main_battle_tanks_reason: "Main Battle Tanks are the next obvious step in land warfare's evolution, we must learn to utilize them efficiently.\n$TOOLTIP_DELIMITER$\nCompleted once #v 20%#! of our [concept_army] (#v 10%#! while at [concept_war]) consists of $combat_unit_type_armored_brigade$.\n#lore Researching $composite_armor$ will also complete this entry.#!"
 je_2nd_generation_main_battle_tanks_reason: "Composite armor has made the tanks of the previous decade obsolete. Our armored brigades must be rebuilt around the new generation of vehicles.\n$TOOLTIP_DELIMITER$\nCompleted once #v 20%#! of our [concept_army] (#v 10%#! while at [concept_war]) consists of $combat_unit_type_armored_brigade$.\n#lore Researching $depleted_uranium_rounds$ will also complete this entry.#!"
 je_3rd_generation_main_battle_tanks_reason: "Depleted uranium rounds pierce any armor fielded today. Equipping our armored brigades with them will give our tanks a decisive edge.\n$TOOLTIP_DELIMITER$\nCompleted once #v 20%#! of our [concept_army] (#v 10%#! while at [concept_war]) consists of $combat_unit_type_armored_brigade$.\nOur [concept_army] must also use the #v Depleted Uranium Munitions#! [concept_mobilization_option] (#v 80%#!, or #v 40%#! while at [concept_war])."
 je_self_propelled_artillery_reason: "Towed guns cannot keep up with mechanized offensives. Mounting our artillery on tracked chassis will let it follow our spearheads.\n$TOOLTIP_DELIMITER$\nCompleted once #v 10%#! of our [concept_army] (#v 5%#! while at [concept_war]) consists of $combat_unit_type_self_propelled_guns$."
 je_mlrs_artillery_reason: "Multiple rocket launchers can saturate an entire grid square within seconds. Fielding them in numbers will multiply the firepower of our army.\n$TOOLTIP_DELIMITER$\nCompleted once #v 10%#! of our [concept_army] (#v 5%#! while at [concept_war]) consists of $combat_unit_type_rocket_artillery$."
 je_guided_missile_artillery_reason: "Tactical ballistic missiles can strike deep behind the front with great precision. Integrating them into our army will extend its reach far beyond the range of conventional artillery.\n$TOOLTIP_DELIMITER$\nCompleted once #v 10%#! of our [concept_army] (#v 5%#! while at [concept_war]) consists of $combat_unit_type_tbm_launchers$."
 je_motorized_reason: "An army moving on foot is an army that arrives too late. Trucks and jeeps must carry our soldiers to the front.\n$TOOLTIP_DELIMITER$\nCompleted once #v 80%#! of our [concept_army] (#v 40%#! while at [concept_war]) uses the #v Motorization#! [concept_mobilization_option]."
 je_armoured_personal_carriers_reason: "Armored personnel carriers allow our infantry to keep pace with our tanks while being protected from shrapnel and small-arms fire.\n$TOOLTIP_DELIMITER$\nCompleted once #v 20%#! of our [concept_army] (#v 10%#! while at [concept_war]) consists of $combat_unit_type_mechanized_brigade$."
 je_infantry_fighting_vehicle_carriers_reason: "Infantry fighting vehicles do not merely carry soldiers into battle, they fight alongside them. Combined with anti-tank guided missiles, they make our mechanized infantry a match for any armored force.\n$TOOLTIP_DELIMITER$\nCompleted once #v 20%#! of our [concept_army] (#v 10%#! while at [concept_war]) consists of $combat_unit_type_mechanized_brigade$.\nOur [concept_army] must also use the #v ATGM Deployment#! [concept_mobilization_option] (#v 80%#!, or #v 40%#! while at [concept_war])."
 je_multi_role_armored_fighting_vehicles_reason: "Modular armored vehicles can be adapted to any mission, from reconnaissance to fire support. Brigades built around them can respond to every kind of threat.\n$TOOLTIP_DELIMITER$\nCompleted once #v 20%#! of our [concept_army] (#v 10%#! while at [concept_war]) consists of $combat_unit_type_tactical_brigade$."
 je_motorized_reconnaissance_reason: "Fast reconnaissance units on wheels can find the enemy long before our main forces make contact.\n$TOOLTIP_DELIMITER$\nCompleted once #v 80%#! of our [concept_army] (#v 40%#! while at [concept_war]) uses the #v Mobile Recon#! [concept_mobilization_option]."
 je_helicopter_reconnaissance_reason: "Helicopters let our scouts look beyond hills and rivers, and report the movements of the enemy in real time.\n$TOOLTIP_DELIMITER$\nCompleted once #v 80%#! of our [concept_army] (#v 40%#! while at [concept_war]) uses the #v Helicopter Recon#! [concept_mobilization_option]."
 je_drone_reconnaissance_reason: "Unmanned drones can watch the enemy day and night without risking the lives of our pilots.\n$TOOLTIP_DELIMITER$\nCompleted once #v 80%#! of our [concept_army] (#v 40%#! while at [concept_war]) uses the #v Recon Drones#! [concept_mobilization_option]."
 je_combat_medics_reason: "Every soldier saved on the battlefield is a veteran gained. Trained medics must accompany our troops into combat.\n$TOOLTIP_DELIMITER$\nCompleted once #v 80%#! of our [concept_army] (#v 40%#! while at [concept_war]) uses the #v First Aid#! [concept_mobilization_option]."
 je_army_field_hospitals_reason: "Field hospitals close to the front, supplied by helicopter evacuation, can return wounded soldiers to the ranks within weeks.\n$TOOLTIP_DELIMITER$\nCompleted once #v 80%#! of our [concept_army] (#v 40%#! while at [concept_war]) uses the #v Field Hospitals#! [concept_mobilization_option]."
 je_jet_fighters_reason: "Jet engines have made propeller aircraft obsolete overnight. Our air force must be rebuilt around the new jet fighters to keep control of the skies.\n$TOOLTIP_DELIMITER$\nCompleted once #v 10%#! of our [concept_army] (#v 5%#! while at [concept_war]) consists of $combat_unit_type_air_superiority_fighters$."
 je_supersonic_jet_fighters_reason: "Supersonic aircraft can strike targets far behind the front before any defense can react.\n$TOOLTIP_DELIMITER$\nCompleted once #v 10%#! of our [concept_army] (#v 5%#! while at [concept_war]) consists of $combat_unit_type_tactical_bombers$."
 je_4th_generation_jet_fighters_reason: "Modern multirole jets can win air superiority and attack ground targets in the same sortie.\n$TOOLTIP_DELIMITER$\nCompleted once #v 10%#! of our [concept_army] (#v 5%#! while at [concept_war]) consists of $combat_unit_type_fighter_bombers$."
 je_5th_generation_jet_fighters_reason: "Stealth aircraft can penetrate even the most advanced air defenses undetected.\n$TOOLTIP_DELIMITER$\nCompleted once #v 10%#! of our [concept_army] (#v 5%#! while at [concept_war]) consists of $combat_unit_type_stealth_aircraft$."
 je_deep_battle_reason: "Our theorists argue that the enemy must be engaged throughout the full depth of his defenses at once, with armored forces breaking through and exploiting deep into his rear, supplied along our railways.\n$TOOLTIP_DELIMITER$\nCompleted once #v 20%#! of our [concept_army] (#v 10%#! while at [concept_war]) consists of $combat_unit_type_armored_brigade$.\nOur [concept_army] must also use the #v Rail Logistics#! [concept_mobilization_option] (#v 80%#!, or #v 40%#! while at [concept_war]).\n$TOOLTIP_DELIMITER$\nPutting the doctrine into practice can advance our research of $mobile_warfare$.\n#lore Researching $squad_specialist_weapons$ will also complete this entry.#!"
 je_combined_arms_warfare_reason: "Infantry, tanks and artillery achieve far more when they fight together than apart. Our army must learn to coordinate all of its arms on the battlefield.\n$TOOLTIP_DELIMITER$\nCompleted once our army uses $pm_basic_training_barracks$, the #v Motorization#! [concept_mobilization_option], $combat_unit_type_armored_brigade$ and $combat_unit_type_wartime_artillery$.\nPutting the doctrine into practice can advance our research of $squad_specialist_weapons$.\n#lore Researching $armored_personnel_carriers$ will also complete this entry.#!"
 je_mechanized_warfare_reason: "A fully mechanized army can concentrate overwhelming force wherever the enemy is weakest. Our doctrine must be built around armor, mechanized infantry and self-propelled artillery.\n$TOOLTIP_DELIMITER$\nCompleted once our army uses $pm_nco_instruction_barracks$, $combat_unit_type_armored_brigade$, $combat_unit_type_mechanized_brigade$ and $combat_unit_type_self_propelled_guns$.\nPutting the doctrine into practice can advance our research of $armored_personnel_carriers$.\n#lore Researching $airmobile_warfare$ will also complete this entry.#!"
 je_advanced_combined_arms_reason: "Guided missiles, rocket artillery and close air support have changed the nature of the combined arms battle. Our doctrine must integrate them all.\n$TOOLTIP_DELIMITER$\nCompleted once our army uses $combat_unit_type_mechanized_brigade$, the #v ATGM Deployment#! [concept_mobilization_option], $combat_unit_type_rocket_artillery$ and $combat_unit_type_fighter_bombers$.\nPutting the doctrine into practice can advance our research of $airmobile_warfare$.\n#lore Researching $recon_drones$ will also complete this entry.#!"
 je_early_network_warfare: "Early Network Warfare Doctrine"
 je_early_network_warfare_reason: "Helicopters, portable air defenses and modern aircraft can strike wherever the enemy reveals himself, if only our units share what they see. Our doctrine must connect them.\n$TOOLTIP_DELIMITER$\nCompleted once our army uses $combat_unit_type_air_mobile_brigade$, the #v Helicopter Recon#! and #v MANPAD Deployment#! [Concept('concept_mobilization_option', '$concept_mobilization_options|q$')] and $combat_unit_type_fighter_bombers$.\nPutting the doctrine into practice can advance our research of $recon_drones$.\n#lore Researching $fourth_generation_warfare$ will also complete this entry.#!"
 je_total_network_warfare_reason: "In a fully networked army every sensor, soldier and weapon is connected. The side that sees first and strikes first wins.\n$TOOLTIP_DELIMITER$\nCompleted once our army uses the #v Recon Drones#! and #v Field Hospitals#! [Concept('concept_mobilization_option', '$concept_mobilization_options|q$')], $combat_unit_type_tbm_launchers$ and $combat_unit_type_stealth_aircraft$.\nPutting the doctrine into practice can advance our research of $fourth_generation_warfare$."
