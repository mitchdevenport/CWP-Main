l_japanese:
 # CWP texts for keys the base game also defines since 1.15 (replace/ makes CWP's win)
 ideology_managerial_desc: "This group believes that the state and its enterprises should be run by trained professional managers rather than by owners or politicians."
 # Base game texts that name its own unit groups and types, pointed at CWP's (1.15 evaluates them in the interface)
 ARMY_TOO_MANY_EXPECTED_UNITS_OF_THIS_UNIT_GROUP_TOOLTIP: "@warning! 現在[Concept('concept_incoming_units', '$concept_incoming_units_short|q$')]中の[Concept('concept_special_unit','$concept_special_units|q$')]が加わったら、#b [GetCombatUnitGroup('combat_unit_group_fire_support').GetName]#!と#b [GetCombatUnitGroup('combat_unit_group_aviation').GetName]#!の数が#b [GetCombatUnitGroup('combat_unit_group_frontline_brigades').GetName]#!の数よりも多いため、[MilitaryFormation.GetName]の[concept_organization]上限が影響を受けます\n\n#title 各[Concept('concept_combat_unit_group','$concept_combat_unit_group_short|q$')]内の[Concept('concept_unit','$concept_units|q$')]の合計数\n（現在 + [Concept('concept_incoming_units', '$concept_incoming_units_short|q$')]）:#!\n@battalions! #v [MilitaryFormation.GetNumTotalCombatUnitsExpectedInGroup(GetCombatUnitGroup('combat_unit_group_frontline_brigades').Self)]#! #b [GetCombatUnitGroup('combat_unit_group_frontline_brigades').GetName]#!\n@battalions! #v [MilitaryFormation.GetNumSpecialUnitsExpected]#! [Concept('concept_special_unit','$concept_special_units|q$')]\n$TAB$@battalions! #v [MilitaryFormation.GetNumTotalCombatUnitsExpectedInGroup(GetCombatUnitGroup('combat_unit_group_fire_support').Self)]#! #b [GetCombatUnitGroup('combat_unit_group_fire_support').GetName]#!\n$TAB$@battalions! #v [MilitaryFormation.GetNumTotalCombatUnitsExpectedInGroup(GetCombatUnitGroup('combat_unit_group_aviation').Self)]#! #b [GetCombatUnitGroup('combat_unit_group_aviation').GetName]#!\n\n[MilitaryFormation.GetEffectFromSpecialUnitsDesc]"
 ARMY_TOO_MANY_UNITS_OF_THIS_UNIT_GROUP_TOOLTIP: "@warning! #b [GetCombatUnitGroup('combat_unit_group_fire_support').GetName]#!と#b [GetCombatUnitGroup('combat_unit_group_aviation').GetName]#!の数が#b [GetCombatUnitGroup('combat_unit_group_frontline_brigades').GetName]#!の数よりも多いため、[MilitaryFormation.GetName]の[concept_organization]上限が影響を受けています\n\n#title 各[Concept('concept_combat_unit_group','$concept_combat_unit_group_short|q$')]内の[Concept('concept_unit','$concept_units|q$')]の合計数\n（現在 + [Concept('concept_incoming_units', '$concept_incoming_units_short|q$')]）:#!\n@battalions! #v [MilitaryFormation.GetNumTotalCombatUnitsExpectedInGroup(GetCombatUnitGroup('combat_unit_group_frontline_brigades').Self)]#! #b [GetCombatUnitGroup('combat_unit_group_frontline_brigades').GetName]#!\n@battalions! #v [MilitaryFormation.GetNumSpecialUnitsExpected]#! [Concept('concept_special_unit','$concept_special_units|q$')]\n$TAB$@battalions! #v [MilitaryFormation.GetNumTotalCombatUnitsExpectedInGroup(GetCombatUnitGroup('combat_unit_group_fire_support').Self)]#! #b [GetCombatUnitGroup('combat_unit_group_fire_support').GetName]#!\n$TAB$@battalions! #v [MilitaryFormation.GetNumTotalCombatUnitsExpectedInGroup(GetCombatUnitGroup('combat_unit_group_aviation').Self)]#! #b [GetCombatUnitGroup('combat_unit_group_aviation').GetName]#!\n\n[MilitaryFormation.GetEffectFromSpecialUnitsDesc]"
 MILITARY_FORMATION_UNITS_UPGRADE_ALL_DESC: "これによりアップグレード可能なユニットを以下にアップグレードします:\n歩兵は[MilitaryFormation.GetSelectedUnitTypeForGroup(GetCombatUnitGroup('combat_unit_group_frontline_brigades').Self).GetNameWithCulture(MilitaryFormation.GetPrimaryCultureForGroup(GetCombatUnitGroup('combat_unit_group_frontline_brigades').Self).Self)]\n砲兵は[MilitaryFormation.GetSelectedUnitTypeForGroup(GetCombatUnitGroup('combat_unit_group_fire_support').Self).GetNameWithCulture(MilitaryFormation.GetPrimaryCultureForGroup(GetCombatUnitGroup('combat_unit_group_fire_support').Self).Self)]\n騎兵は[MilitaryFormation.GetSelectedUnitTypeForGroup(GetCombatUnitGroup('combat_unit_group_aviation').Self).GetNameWithCulture(MilitaryFormation.GetPrimaryCultureForGroup(GetCombatUnitGroup('combat_unit_group_aviation').Self).Self)]"
 concept_combat_unit_group_desc: "$concept_units$は[Concept('concept_default_unit','$concept_default_units|q$')]と[Concept('concept_special_unit','$concept_special_units|q$')]に分類され、それぞれに異なる長所と短所があります。#b 例えば、[GetCombatUnitGroup('combat_unit_group_frontline_brigades').GetName]#! は領地を守るのに適しているのに対し、#b [GetCombatUnitGroup('combat_unit_group_aviation').GetName]#! は[concept_occupation]に適しています。"
 concept_default_unit_desc: "[Concept('concept_army','$concept_armies|q$')]の#b [GetCombatUnitGroup('combat_unit_group_frontline_brigades').GetName]#!の[Concept('concept_unit','$concept_units|q$')]のことです。"
 concept_special_unit_desc: "[Concept('concept_default_unit','$concept_default_units|q$')]とみなされる#b [GetCombatUnitGroup('combat_unit_group_frontline_brigades').GetName]#!ではない[Concept('concept_unit','$concept_units|q$')]のことです。\n\n[Concept('concept_army','$concept_armies|q$')]の$concept_special_units$:\n$TAB$#b [GetCombatUnitGroup('combat_unit_group_fire_support').GetName]#!\n$TAB$#b [GetCombatUnitGroup('combat_unit_group_aviation').GetName]#!"
 country_can_only_conscript_peasants_bool_desc: "[Concept('concept_conscript_battalion', '$concept_conscript_battalions|q$')]を[GetCombatUnitType('combat_unit_type_mechanized_brigade').GetName]を除く#b [GetCombatUnitGroup('combat_unit_group_frontline_brigades').GetName]#! [Concept('concept_unit', '$concept_combat_unit_types|q$')]のみで編成します"
 # Base game 1.14 texts for ideologies CWP keeps (1.15 renamed the base game's versions)
 ideology_social_democrat: "社会民主主義者"
 ideology_social_democrat_desc: "#lore このリーダーは、議会改革によって社会主義社会を実現することを信じています。 #!"
 ideology_proletarian_movement: "$ideology_proletarian$"
 ideology_proletarian_movement_desc: "#lore この運動は階級闘争というレンズを通して政治を見ており、労働者の条件改善と政治的影響力の増大を支持しています。#!"
 ideology_vanguardist_movement: "前衛主義者"
 ideology_vanguardist_movement_desc: "#lore 急進的な前衛政党が主導する革命を通じ社会主義社会の実現を目指す運動です。#!"
