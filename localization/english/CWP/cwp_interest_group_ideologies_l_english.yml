l_english:
 ideology_cwp_security_establishment:0 "Security Establishment"
 ideology_cwp_security_establishment_desc:0 "This group favors professional armed forces, experienced appointed administrators and permanent intelligence institutions."
 ideology_cwp_religious_social_solidarity:0 "Religious Social Solidarity"
 ideology_cwp_religious_social_solidarity_desc:0 "This group regards worker protection, social provision and the education and protection of children as moral obligations."
 ideology_cwp_organized_employers:0 "Organized Employers"
 ideology_cwp_organized_employers_desc:0 "This group defends managerial control and corporate freedom while accepting negotiated labor relations and access to migrant labor."
 ideology_cwp_constitutional_intelligentsia:0 "Constitutional Intelligentsia"
 ideology_cwp_constitutional_intelligentsia_desc:0 "This group demands independent courts, professional administration and freedom of conscience."
 ideology_cwp_commercial_landowners:0 "Commercial Landowners"
 ideology_cwp_commercial_landowners_desc:0 "This group defends commercial and estate agriculture against compulsory redistribution, heavy land taxes and strong rural labor organization."
 ideology_cwp_small_proprietors:0 "Small Proprietors"
 ideology_cwp_small_proprietors_desc:0 "This group seeks protection from monopolies, moderate taxation and predictable independent courts."
 ideology_cwp_cooperative_agrarianism:0 "Cooperative Agrarianism"
 ideology_cwp_cooperative_agrarianism_desc:0 "This group supports family holdings and voluntary producer cooperation, fair competition and accessible schooling."
 ideology_cwp_free_trade_unionism:0 "Free Trade Unionism"
 ideology_cwp_free_trade_unionism_desc:0 "This group seeks unions independent of employers and ruling parties, democratic participation and independent courts."
 ideology_statist: "Statist"
 ideology_statist_desc: "This group sees a strong, centralized state as the guarantor of order, security and national development."
 ideology_state_paternalism: "State Paternalism"
 ideology_state_paternalism_desc: "This group holds that the state has a duty to look after its citizens through public schooling, health care and welfare."
