l_english:
 ai_strategy_superpower_industrial_complex: "Autarkic Industrial Complex"
 ai_strategy_superpower_industrial_complex_desc: "[COUNTRY.GetName] seeks to dominate advanced manufacturing and armaments through complete domestic industrial supply chains."
 ai_strategy_maintain_hegemony: "Maintain Industrial Hegemony"
 ai_strategy_maintain_hegemony_desc: "[COUNTRY.GetName] seeks to preserve its global position through trade, finance, advanced exports, and strategic military production."
 ai_strategy_postwar_reconstruction: "Postwar Reconstruction"
 ai_strategy_postwar_reconstruction_desc: "[COUNTRY.GetName] is rebuilding its infrastructure, power supply, and foundational industries before moving into advanced exports."
 ai_strategy_high_value_export_economy: "High-Value Export Economy"
 ai_strategy_high_value_export_economy_desc: "[COUNTRY.GetName] relies on imported feedstocks to produce advanced manufactured goods and services for world markets."
 ai_strategy_elite_controlled_production: "Elite-Controlled Production"
 ai_strategy_elite_controlled_production_desc: "[COUNTRY.GetName] favors concentrated ownership of land and resource exports over broad-based industrialization."
 ai_strategy_petroleum_export_economy: "Petroleum Export Economy"
 ai_strategy_petroleum_export_economy_desc: "[COUNTRY.GetName] is organizing its economy around oil, natural gas, refining, and petrochemical exports."

 # Diplomatic and political strategies
 ai_strategy_global_liberalism: "Global Liberalism"
 ai_strategy_global_liberalism_desc: "[COUNTRY.GetName] wants to spread democratic ideals across the globe."
 ai_strategy_international_socialism: "International Socialism"
 ai_strategy_international_socialism_desc: "[COUNTRY.GetName] took it upon itself to spread socialism across the globe."
 ai_strategy_hardline_communist: "Hardline Communist"
 ai_strategy_hardline_communist_desc: "[COUNTRY.GetName] is a hardline communist nation, and will do whatever it takes to make sure its people are all 'equal'."
 ai_strategy_liberal_agenda: "Liberal Agenda"
 ai_strategy_liberal_agenda_desc: "[COUNTRY.GetName] wants to maintain its liberal ideals."
 ai_strategy_conservative_communist: "Conservative Communist"
 ai_strategy_conservative_communist_desc: "[COUNTRY.GetName] defends the established socialist order and resists any reform that could weaken the leading role of the Party."
 ai_strategy_reformist_communist: "Reformist Communist"
 ai_strategy_reformist_communist_desc: "[COUNTRY.GetName] seeks to reform socialism from within, loosening central control while preserving the gains of the revolution."
 ai_strategy_socialist_agenda: "Socialist Agenda"
 ai_strategy_socialist_agenda_desc: "[COUNTRY.GetName] seeks to bring the commanding heights of the economy under public control and to empower the working class."
 ai_strategy_welfare_agenda: "Welfare Agenda"
 ai_strategy_welfare_agenda_desc: "[COUNTRY.GetName] is building a welfare state, expanding social insurance, public health care and education."
 ai_strategy_autocratic_agenda: "Autocratic Agenda"
 ai_strategy_autocratic_agenda_desc: "[COUNTRY.GetName] seeks to concentrate power in the hands of its rulers and keep popular participation in check."
 ai_strategy_juntaist_agenda: "Juntaist Agenda"
 ai_strategy_juntaist_agenda_desc: "[COUNTRY.GetName] is governed in the interests of its armed forces, who value order and national security above civilian politics."
 ai_strategy_anti_communist_agenda: "Anti-Communist Agenda"
 ai_strategy_anti_communist_agenda_desc: "[COUNTRY.GetName] is determined to root out communist influence at home and to contain it abroad."
 ai_strategy_security_agenda: "Security Agenda"
 ai_strategy_security_agenda_desc: "[COUNTRY.GetName] places internal security and the struggle against subversion above all other priorities."
 ai_strategy_human_rights_agenda: "Human Rights Agenda"
 ai_strategy_human_rights_agenda_desc: "[COUNTRY.GetName] is committed to extending civil liberties and protecting the rights of the individual."
