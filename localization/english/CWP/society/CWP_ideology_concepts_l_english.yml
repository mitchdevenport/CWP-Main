l_english:
 concept_ideology_social: "Social"
 concept_ideology_social_desc: "Unions that accept a market or mixed economy and organise independently of employers and the ruling party, pursuing reform rather than socialisation. Under this outlook the $ig_trade_unions$ hold the $ideology_cwp_free_trade_unionism$ ideology."
 concept_ideology_vanguardist: "Vanguardist"
 concept_ideology_vanguardist_desc: "Unions organised as transmission belts of a state-socialist vanguard, as under a council republic or a command economy. Under this outlook the $ig_trade_unions$ hold the $ideology_populist$ and $ideology_socialist$ ideologies."
 concept_ideology_socialist: "Socialist"
 concept_ideology_socialist_desc: "Unions committed to democratic socialism and worker ownership without a command economy. Under this outlook the $ig_trade_unions$ hold the $ideology_socialist$ ideology."
 concept_ideology_royalist: "Royalist"
 concept_ideology_royalist_desc: "Elites whose station rests on a crown or a clerical throne. Under this outlook the $ig_landowners$ hold the $ideology_paternalistic$ ideology."
 concept_ideology_republican: "Republican"
 concept_ideology_republican_desc: "Elites who have made their peace with the republic and defend their interests within it. Under this outlook the $ig_landowners$ hold the $ideology_republican_paternalistic$ ideology."
 concept_ideology_traditionalist: "Traditionalist"
 concept_ideology_traditionalist_desc: "Elites rooted in a traditional, agrarian economy of estates, tenants and customary obligations. Under this outlook the $ig_landowners$ hold the $ideology_hierarchic$ ideology."
 concept_ideology_materialistic: "Materialistic"
 concept_ideology_materialistic_desc: "Elites who have turned their estates into commercial enterprises in a modern economy. Under this outlook the $ig_landowners$ hold the $ideology_cwp_commercial_landowners$ ideology."
