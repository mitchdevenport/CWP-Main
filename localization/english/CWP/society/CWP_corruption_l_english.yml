 COR_LANDOWNERS: "$ig_landowners$ [concept_corruption]"
 COR_BUREAUCRATS: "$ig_bureaucrats$ [concept_corruption]"
 COR_INDUSTRIALISTS: "$ig_industrialists$ [concept_corruption]"
 COR_ARMED_FORCES: "$ig_armed_forces$ [concept_corruption]"
 COR_INTELLIGENTSIA: "$ig_intelligentsia$ [concept_corruption]"
 COR_DEVOUT: "$ig_devout$ [concept_corruption]"
 COR_PETTY_BOURGEOISIE: "$ig_petty_bourgeoisie$ [concept_corruption]"
 COR_RURAL_FOLK: "$ig_rural_folk$ [concept_corruption]"
 COR_TRADE_UNIONS: "$ig_trade_unions$ [concept_corruption]"

 COR_ANTI_CORRUPTION_DRIVE: "Anti-Corruption Drive"
 COR_ANTI_CORRUPTION_PURGE: "Anti-Corruption Purge"

 # Events
 corruption_events.1.t: "Anti-Corruption Purge"
 corruption_events.1.d: "Like an insidious behemoth, corruption has taken hold of the [ROOT.GetCountry.GetAdjectiveNoFormatting] government and its processes, extreme measures must be taken to root out this evil from its core."
 corruption_events.1.f: "Our purge will be swift, decisive, and just. Those found guilty of corruption will be removed from office and prosecuted to the fullest extent of the law, this insidious cancer will be torn from our society and discarded!"
 corruption_events.1.a: "Give the order.."
