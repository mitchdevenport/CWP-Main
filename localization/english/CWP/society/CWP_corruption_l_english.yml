l_english:
 # Corruption tooltip (topbar)
 CORRUPTION_TOOLTIP_TITLE: "#T [concept_corruption]#!"
 CORRUPTION_BALANCE: "Balance: #n [GetPlayer.MakeScope.ScriptValue('corruption_value')|d1]%#! with a [concept_corruption_baseline] of #z [GetPlayer.MakeScope.ScriptValue('corruption_baseline')|d1]#!\n$TOOLTIP_DELIMITER$"
 CORRUPTION_EFFECTS_TOOL: "Effects from having a total of #n [GetPlayer.MakeScope.ScriptValue('corruption_value')|d1]%#! [concept_corruption]:\n[GetScriptedGui('showmodifier_corruption').ExecuteTooltip( GuiScope.SetRoot(GetPlayer.MakeScope).End)]\n$TOOLTIP_DELIMITER$"
 CORRUPTION_TOOLTIP_SUM1: "#t Your [concept_corruption] growth/decay is due to:"
 CORRUPTION_TOOLTIP_SUM2: "#t Your [concept_corruption_baseline] is due to:"

 corruption_modifier_effects: "Corruption"
 modifier_corruption_effects: "Corruption"
 corruption_effects: "Corruption"
 ig_corruption_modifier: "Corruption"
 modifier_corruption: "Corruptible Character"
 modifier_honest: "Honest Character"

 # Modifier types
 country_corruption_add: "Corruption if in Power"
 country_corruption_add_desc: "A bonus or penalty to the IG corruption value"
 country_corruption_increase_add: "Corruption Increase if in Power"
 country_corruption_increase_add_desc: "A bonus or penalty to the IG corruption increase value"
 interest_group_corruption_decay: "Monthly [concept_ig_corruption] Decrease"
 interest_group_corruption_decay_desc: "How much [concept_ig_corruption] decays per month."

 # Corruption Decisions
 anti_corruption_drive_tooltip: "You have more than #v 10%#! [concept_corruption]."
 anti_corruption_drive: "Launch Anti-Corruption Drive"
 anti_corruption_drive_desc: "Corruption is slowly becoming rampant in our government, we should take measures to curtail its spread."
 anti_corruption_drive_conducted: "Anti-Corruption Drive Conducted"

 anti_corruption_purge_tooltip: "You have more than #v 25%#! [concept_corruption]."
 anti_corruption_purge: "Launch Anti-Corruption Purge"
 anti_corruption_purge_desc: "The only way to deal with corruption is to tear it from the system root and stem. We should take measures to conduct a thorough cleansing of our government."
 anti_corruption_purge_conducted: "Anti-Corruption Purge Conducted"

 # Corruption color locs
 corruption_low: "#p [GetPlayer.MakeScope.ScriptValue('corruption_value')|d1]% #!"
 corruption_med: "#z [GetPlayer.MakeScope.ScriptValue('corruption_value')|d1]% #!"
 corruption_high: "#n [GetPlayer.MakeScope.ScriptValue('corruption_value')|d1]% #!"

 # Interest group corruption (politics panel)
 DETAILED_CORRUPTION: "[concept_corruption]: #N [InterestGroup.MakeScope.ScriptValue('ig_corruption_value')|%1N]#!"
 IG_CORRUPTION_HEADER: "[concept_corruption]"
 ig_corruption_tooltip: "This [concept_interest_group] will contribute its average of #N #bold [InterestGroup.MakeScope.ScriptValue('ig_corruption_value')|%2N]#! [concept_corruption] #! to the country if in [concept_government], divided by the number of interest groups in government.\n\nEach month [concept_ig_corruption] will change by #bold [InterestGroup.MakeScope.ScriptValue('ig_corruption_growth')|-0d]#! due to: \n\n[InterestGroup.MakeScope.GetScriptValueDesc('ig_corruption_growth')]"

 # IG Corruption Growth Sources
 COR_GOVERNMENT_AUTOCRACY: "Being in [concept_government] in an autocracy"
 COR_GOVERNMENT_OLIGARCHY: "Being in [concept_government] in an oligarchy"
 COR_GOVERNMENT_ANOCRACY: "Being in [concept_government] in an anocracy"
 COR_GOVERNMENT_DEMOCRACY: "Being in [concept_government] in a democracy"
 COR_GOVERNMENT_TIME: "Time in [concept_government]"
 COR_LEADER: "IG Leader Traits"
 COR_MODIFIER: "Modifiers"
 COR_LAW: "Free Speech Laws"

