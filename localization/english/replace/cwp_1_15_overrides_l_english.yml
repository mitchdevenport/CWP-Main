l_english:
 # CWP texts for keys the base game also defines since 1.15 (replace/ makes CWP's win)
 ideology_managerial_desc: "This group believes that the state and its enterprises should be run by trained professional managers rather than by owners or politicians."
 building_copper_mine: "Copper Mine"
 # Base game texts that name its own unit groups and types, pointed at CWP's (1.15 evaluates them in the interface)
 ARMY_TOO_MANY_EXPECTED_UNITS_OF_THIS_UNIT_GROUP_TOOLTIP: "@warning! Once the number of [Concept('concept_special_unit','$concept_special_units|q$')] currently [Concept('concept_incoming_units', '$concept_incoming_units_short|q$')] have joined, the [concept_organization] limit for [MilitaryFormation.GetName] will be impacted due to having more #b [GetCombatUnitGroup('combat_unit_group_fire_support').GetName]#! and #b [GetCombatUnitGroup('combat_unit_group_aviation').GetName]#! combined than it has #b [GetCombatUnitGroup('combat_unit_group_frontline_brigades').GetName]#!\n\n#title Total numbers of [Concept('concept_unit','$concept_units|q$')] in each [Concept('concept_combat_unit_group','$concept_combat_unit_group_short|q$')]\n(Current + [Concept('concept_incoming_units', '$concept_incoming_units_short|q$')]):#!\n@battalions! #v [MilitaryFormation.GetNumTotalCombatUnitsExpectedInGroup(GetCombatUnitGroup('combat_unit_group_frontline_brigades').Self)]#! #b [GetCombatUnitGroup('combat_unit_group_frontline_brigades').GetName]#!\n@battalions! #v [MilitaryFormation.GetNumSpecialUnitsExpected]#! [Concept('concept_special_unit','$concept_special_units|q$')]\n$TAB$@battalions! #v [MilitaryFormation.GetNumTotalCombatUnitsExpectedInGroup(GetCombatUnitGroup('combat_unit_group_fire_support').Self)]#! #b [GetCombatUnitGroup('combat_unit_group_fire_support').GetName]#!\n$TAB$@battalions! #v [MilitaryFormation.GetNumTotalCombatUnitsExpectedInGroup(GetCombatUnitGroup('combat_unit_group_aviation').Self)]#! #b [GetCombatUnitGroup('combat_unit_group_aviation').GetName]#!\n\n[MilitaryFormation.GetEffectFromSpecialUnitsDesc]"
 ARMY_TOO_MANY_UNITS_OF_THIS_UNIT_GROUP_TOOLTIP: "@warning! The [concept_organization] limit for [MilitaryFormation.GetName] is impacted due to having more #b [GetCombatUnitGroup('combat_unit_group_fire_support').GetName]#! and #b [GetCombatUnitGroup('combat_unit_group_aviation').GetName]#! combined than it has #b [GetCombatUnitGroup('combat_unit_group_frontline_brigades').GetName]#!\n\n#title Total numbers of [Concept('concept_unit','$concept_units|q$')] in each [Concept('concept_combat_unit_group','$concept_combat_unit_group_short|q$')]\n(Current + [Concept('concept_incoming_units', '$concept_incoming_units_short|q$')]):#!\n@battalions! #v [MilitaryFormation.GetNumTotalCombatUnitsExpectedInGroup(GetCombatUnitGroup('combat_unit_group_frontline_brigades').Self)]#! #b [GetCombatUnitGroup('combat_unit_group_frontline_brigades').GetName]#!\n@battalions! #v [MilitaryFormation.GetNumSpecialUnitsExpected]#! [Concept('concept_special_unit','$concept_special_units|q$')]\n$TAB$@battalions! #v [MilitaryFormation.GetNumTotalCombatUnitsExpectedInGroup(GetCombatUnitGroup('combat_unit_group_fire_support').Self)]#! #b [GetCombatUnitGroup('combat_unit_group_fire_support').GetName]#!\n$TAB$@battalions! #v [MilitaryFormation.GetNumTotalCombatUnitsExpectedInGroup(GetCombatUnitGroup('combat_unit_group_aviation').Self)]#! #b [GetCombatUnitGroup('combat_unit_group_aviation').GetName]#!\n\n[MilitaryFormation.GetEffectFromSpecialUnitsDesc]"
 MILITARY_FORMATION_UNITS_UPGRADE_ALL_DESC: "This will upgrade all units that can into:\n[MilitaryFormation.GetSelectedUnitTypeForGroup(GetCombatUnitGroup('combat_unit_group_frontline_brigades').Self).GetNameWithCulture(MilitaryFormation.GetPrimaryCultureForGroup(GetCombatUnitGroup('combat_unit_group_frontline_brigades').Self).Self)] for Infantry\n[MilitaryFormation.GetSelectedUnitTypeForGroup(GetCombatUnitGroup('combat_unit_group_fire_support').Self).GetNameWithCulture(MilitaryFormation.GetPrimaryCultureForGroup(GetCombatUnitGroup('combat_unit_group_fire_support').Self).Self)] for Artillery\n[MilitaryFormation.GetSelectedUnitTypeForGroup(GetCombatUnitGroup('combat_unit_group_aviation').Self).GetNameWithCulture(MilitaryFormation.GetPrimaryCultureForGroup(GetCombatUnitGroup('combat_unit_group_aviation').Self).Self)] for Cavalry"
 concept_combat_unit_group_desc: "$concept_units$ are categorized into [Concept('concept_default_unit','$concept_default_units|q$')] and [Concept('concept_special_unit','$concept_special_units|q$')] which possess different strengths and weaknesses. #b [GetCombatUnitGroup('combat_unit_group_frontline_brigades').GetName]#! is better suited for defending territory, while #b [GetCombatUnitGroup('combat_unit_group_aviation').GetName]#! is better at [concept_occupation] for example."
 concept_default_unit_desc: "These are #b [GetCombatUnitGroup('combat_unit_group_frontline_brigades').GetName]#! [Concept('concept_unit','$concept_units|q$')] in [Concept('concept_army','$concept_armies|q$')]."
 concept_special_unit_desc: "These are [Concept('concept_unit','$concept_units|q$')] that are not #b [GetCombatUnitGroup('combat_unit_group_frontline_brigades').GetName]#! which are considered [Concept('concept_default_unit','$concept_default_units|q$')].\n\n$concept_special_units$ for [Concept('concept_army','$concept_armies|q$')]:\n$TAB$#b [GetCombatUnitGroup('combat_unit_group_fire_support').GetName]#!\n$TAB$#b [GetCombatUnitGroup('combat_unit_group_aviation').GetName]#!"
 country_can_only_conscript_peasants_bool_desc: "[Concept('concept_conscript_battalion', '$concept_conscript_battalions|q$')] can only consist of #b [GetCombatUnitGroup('combat_unit_group_frontline_brigades').GetName]#! [Concept('concept_unit', '$concept_combat_unit_types|q$')], except [GetCombatUnitType('combat_unit_type_mechanized_brigade').GetName]"
 # Base game 1.14 texts for ideologies CWP keeps (1.15 renamed the base game's versions)
 ideology_social_democrat: "Social Democrat"
 ideology_social_democrat_desc: "#lore This leader believes in achieving a socialist society through parliamentary reform. #!"
 ideology_proletarian_movement: "$ideology_proletarian$"
 ideology_proletarian_movement_desc: "#lore This movement views politics through the lens of class struggle, supporting better conditions and increased political influence for workers.#!"
 ideology_vanguardist_movement: "Vanguardist"
 ideology_vanguardist_movement_desc: "#lore This movement seeks to achieve a socialist society through a revolution headed by a vanguard party of dedicated radicals.#!"
