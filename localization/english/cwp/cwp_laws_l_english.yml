l_english:

# Army Model Laws:
  law_disarmed_nation: "Disarmed Nation"

# Bureaucracy Laws:
  law_politicized_bureaucrats: "Politicized Administration"
  law_politicized_bureaucrats_desc: "The state bureaucracy is closely fused with ruling political interests, trading administrative autonomy for discipline and ideological control."

# Corporate Affairs Laws:
  lawgroup_corporate_affairs: "Corporate Affairs"
  law_no_corporate_regulation: "No Regulation"
  law_no_corporate_regulation_desc: "The state maintains no dedicated corporate regulatory apparatus, leaving company formation and privileges to ordinary commercial law."
  law_national_champions: "National Champions"
  law_national_champions_desc: "The state cultivates a smaller set of favored firms through charters, administrative support, and coordinated industrial policy."
  law_corporate_deregulation: "Corporate Deregulation"
  law_corporate_deregulation_desc: "The state loosens corporate oversight, allowing more companies to compete with fewer special charters and faster company expansion."
  law_antitrust_legislation: "Antitrust Legislation"
  law_antitrust_legislation_desc: "The state restrains concentrated corporate power, improving general market throughput while reducing the advantages of company-backed buildings."

# Internal Security Laws:
  law_domestic_intelligence_agency: "Domestic Intelligence Agency"

# Judiciary Laws:
  lawgroup_judiciary: "Judiciary"
  law_arbitrary_legalism: "Arbitrary Legalism"
  law_puppet_judiciary: "Puppet Judiciary"
  law_judicial_interference: "Judicial Interference"
  law_independent_judiciary: "Independent Judiciary"

# Migration Laws:
  law_encourage_migration: "Encourage Migration"
  law_encourage_migration_desc: "The state actively encourages immigration through permissive quotas, migration incentives, and policies meant to attract new arrivals."

  # Law and law group descriptions
  lawgroup_corporate_affairs_desc: "How the state regulates companies, monopolies and corporate power."
  lawgroup_judiciary_desc: "How far the courts stand apart from those who govern."
  law_arbitrary_legalism_desc: "The law is whatever those in power say it is. Courts rubber-stamp the decisions of the state, and justice is dispensed at the pleasure of the rulers."
  law_puppet_judiciary_desc: "Courts exist and trials are held, but judges serve at the pleasure of the government and seldom rule against it."
  law_judicial_interference_desc: "The judiciary enjoys a measure of independence, yet the government shapes appointments and leans on the courts in politically sensitive cases."
  law_independent_judiciary_desc: "The courts are independent of the government and impartial, able to hold even the state to account."
  law_domestic_intelligence_agency_desc: "A professional intelligence service watches for espionage, subversion and terrorism at home, under at least nominal legal oversight."
  law_disarmed_nation_desc: "The nation keeps no military of its own and relies on other nations for its defense."
  law_state_atheism: "State Atheism"
  law_state_atheism_desc: "The state actively discourages religious participation, discriminating against all faiths."
